  <body>
    <span class="hidden h-20 w-20 border p-1">1 0.25rem</span>

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
              <rect x="2" y="4" width="20" height="16" rx="2" />

        >
          <!-- <div

            class="bg-[rgba(0,0,0,0.5)] h-screen w-full fixed right-0 left-0 bottom-0 top-0"

          <div id="close-icon">X</div>

          <ul>

          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"

        >
          <path d="M4 5h16" />
          <path d="M4 12h16" />

    <script>
      document
        .getElementById("menu-icon")
        .addEventListener("click", function () {
          document.getElementById("sidebar").classList.add("active");
        });

      document
        .getElementById("close-icon")
        .addEventListener("click", function () {
          document.getElementById("sidebar").classList.remove("active");
        });
    </script>
